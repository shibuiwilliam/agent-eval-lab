# コーディング環境（第 1 段）のコーパス計画（SPEC.md 12.3 節、TASK.md 6.2 節、ADR-038 判断 4）。
# 段（stage）と seed は 1 対 1 で、値はここにだけ書く（run_id の段と Run.seed、カセットの塩に入る）。
# tasks は coding/task_sets.yaml の集合名（SPEC.md 7.4 節）。タスクの中身はここに書かない。
# 読み込みは src/agenteval/reports/coding_corpus.py。office 側の ./corpus.yaml とは別物。
#
# run 数: pilot 96、opcheck 10、opcheck2 10、opcheck3 10、corpus 418（TASK.md 6.2 節）。
# live の段は `uv run agenteval coding corpus --stage <段> --dry-run` で見積りを出し、
# 承認（G1: パイロット・操作確認、G2: コーパス）を得てから `--live --approved G<n> --mode record` で始める。

stages:
  # スクリプト化 run（W2）。run の中身は各実験スクリプト（EC-S1・EC-O2・EC-B2 の対照 (a)）と W2-V2 が決める
  offline: {seed: 20261100, mode: sim}
  pilot:
    seed: 20261101
    mode: live
    runs:
      - {version: c01_baseline, tasks: pilot, repeats: 2}
  opcheck:   # 操作確認の 1 回目（c13 の初版。発火 0/10 で「効いていない」。記録として残す。run を作り直さない）
    seed: 20261102
    mode: live
    runs:
      - {version: c13_minimal_fix, tasks: sub10, repeats: 1}
  # 操作確認のやり直し（ADR-037 判断 4・立て直し記録）。プロンプトは同じ版 ID のまま書き換える（版ハッシュが変わる）ので、
  # run_id が 1 回目と衝突しないよう段を分ける。立て直しは 2 回まで: opcheck2（1 回目の立て直し）、opcheck3（2 回目。U1、ユーザーが選択、e2b186c で足した）。
  # 段 opcheck<N> は G1 の承認で走らせ、集計は --only spec だけ（opcheck と同じ扱い。SPEC.md 2.4 節）
  opcheck2:
    seed: 20261104
    mode: live
    runs:
      - {version: c13_minimal_fix, tasks: sub10, repeats: 1}
  # 立て直し 2 回目（U1。ユーザーが選択。ADR-037 の立て直し記録・ADR-044）。プロンプトは同じ版 ID のまま e2b186c で書き換え済み。
  # run_id が opcheck・opcheck2 と衝突しないよう段を分ける。これで立て直しは打ち止め（3 回目は無い）。G1 の承認で走らせ、集計は --only spec だけ
  opcheck3:
    seed: 20261105
    mode: live
    runs:
      - {version: c13_minimal_fix, tasks: sub10, repeats: 1}
  corpus:
    seed: 20261103
    mode: live
    runs:
      - {version: c01_baseline, tasks: core24, repeats: 6}
      - {version: c13_minimal_fix, tasks: core24, repeats: 6}
      - {version: c12_null, tasks: core24, repeats: 2}
      - {version: c04_verbose_ctx, tasks: core24, repeats: 3}   # ADR-044 (A): H2 の検出力のため sub10 × 1 から広げた（+62 run）
      - {version: c01o_no_history_cache, tasks: sub10, repeats: 1}   # G0 項目 13: c01h から入れ替え

# --dry-run の見積りの仮定（TASK.md 6.2 節の「1 run 約 0.045 USD（履歴キャッシュ on）／約 0.097 USD（off）」を
# 単価表（pricing.yaml）から再現するための run あたりの仮定。実測はパイロットで置き換える）。
#   ステップ m のリクエスト = 接頭辞（system＋ツール定義）＋ 初回ユーザーメッセージ ＋ 先行ブロック k < m
#   （ブロック = アシスタント出力の再送＋ツール結果。長さ new_tokens_per_step）。出力は output_tokens_per_step。
#   接頭辞は常に温かいと仮定する（キャッシュ読み出し単価）。history_cache on の版はブロックを初回書き込み・以降読み出し、
#   off の版は接頭辞より後ろをすべて通常入力で数える（SPEC.md 9.1 節の位置モデルと同じ）。
estimate:
  conservative_factor: 1.5
  steps_per_run: 11
  prefix_tokens: 2500
  user0_tokens: 700
  new_tokens_per_step: 1300
  output_tokens_per_step: 300
  # 参照値（TASK.md 6.2 節）。仮定からの再現値がこれと大きくずれたら仮定を直す
  reference_usd_per_run: {history_cache_on: 0.045, history_cache_off: 0.097}

# 実行の既定
concurrency: 1
