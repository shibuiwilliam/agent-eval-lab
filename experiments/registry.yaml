- id: E0-1
  chapter: 0
  title: シミュレート・エージェントと live の一致度（sim の妥当性）
  script: experiments/e0_1_sim_fidelity.py
  hypothesis: "sim（ADR-008）で作った軌跡は、live で同じ (task, version, repeat) を走らせた軌跡と、評価手法が見る量の水準で一致する"
  planted: {versions: [v01_baseline, v03_noverify, v07_step_minimizer], live_runs: 90}
  planted_text: "同じ 10 タスク × 3 版 × 3 反復を live と sim の両方で実行し、評価手法が使う量を突き合わせる"
  control: {same_version_repeat: true}
  control_text: "同じ (task, version, repeat) どうしを対応づけて比較する（版をまたいだ比較はしない）"
  criteria:
    - {metric: outcome_agreement, op: ">=", value: 0.7}
    - {metric: pass_rate_gap, op: "<=", value: 0.15}
    - {metric: tool_sequence_similarity, op: ">=", value: 0.6}
    # 全順序の一致。live 側で同点の版があると定義できないことが分かったが、
    # 「基準は後から緩めない」（CLAUDE.md）ので**残す**。判定は FAIL のままになる
    - {metric: version_ordering_preserved, op: "==", value: 1}
    # 統計的に分離できる版の組に限った順序の一致（ADR-015 で追加。緩めるのではなく足している）
    - {metric: n_separable_version_pairs, op: ">=", value: 1}
    - {metric: ordering_ok_on_separable_pairs, op: "==", value: 1}
  provenance: live
  budget_usd: 3.0

- id: E0-2
  chapter: 0
  title: ジャッジの一致度と安定性（live Sonnet 5 と決定的代替判定器）
  script: experiments/e0_2_judge_fidelity.py
  hypothesis: "決定的代替判定器（judge/rubric.py）は live の Sonnet 5 ジャッジと十分一致し、live ジャッジ自身も再判定に対して安定である"
  planted: {mutations: [wrong_tool, wrong_args, destructive], n_steps: 30}
  planted_text: "E4-5 と同じ 30 ステップ ＋ 3 種の変異（計 120 件）を、live の Sonnet 5 と決定的代替判定器の両方で判定する"
  control: {rejudge: 2}
  control_text: "同じ入力を live ジャッジで 2 回判定し、スコアが ±1 に収まるかを見る（sim では定義上 1.0 になるため検証できなかった項目）"
  criteria:
    - {metric: score_agreement_within_1, op: ">=", value: 0.7}
    - {metric: mutation_drop_rate_live, op: ">=", value: 0.8}
    - {metric: rejudge_agreement_live, op: ">=", value: 0.8}
    - {metric: original_mean_score_live, op: ">=", value: 3.5}
  provenance: live
  budget_usd: 1.5

- id: E3-8
  chapter: 3
  title: 学習済み故障予測によるテスト選択
  script: experiments/e3_8_learned_pts.py
  hypothesis: "変更 × テストの特徴量から回帰確率を学習すると、同じ予算でランダムより高い再現率で回帰を捕まえる"
  planted_text: "原典 3.8 のコールドスタートに従う合成変更 37 件（プロンプト/設定/ツール/モデル/障害/2要因）"
  control_text: "ランダム選択、ベースライン故障率のみ、カバレッジ重なりのみ、不確実性 H(p̂)"
  criteria:
    - {metric: roc_auc, op: ">=", value: 0.75}
    - {metric: recall_at_budget_30, op: ">=", value: 0.80}
    - {metric: recall_ratio_vs_random, op: ">=", value: 2.0}
    - {metric: escape_ratio_vs_random, op: "<=", value: 0.5}
    - {metric: control_random_recall, op: "<=", value: 0.6}
  provenance: simulated
  budget_usd: 0

- id: E3-9
  chapter: 3
  title: 不確実性の役割は探索である（校正の維持）
  script: experiments/e3_9_exploration.py
  hypothesis: "H(p̂) は当該ラウンドの逃走欠陥ではなく、選択器の校正を保つために効く"
  planted_text: "合成変更 37 件を逐次処理し、選んだテストの結果だけでモデルを更新する（部分観測）。探索比 ε を 0/0.05/0.2 で比較"
  control_text: "ε = 0（純粋な活用）。全件観測を上限として併記"
  criteria:
    - {metric: calibration_gain, op: ">", value: 0.0}
    - {metric: escape_gain, op: ">=", value: 0.0}
    - {metric: exploration_cost, op: "<=", value: 0.10}
  provenance: simulated
  budget_usd: 0

- id: E3-10
  chapter: 3
  title: 変更履歴に沿った逐次評価とラーニングカーブ
  script: experiments/e3_10_prequential.py
  hypothesis: "変更履歴・テスト履歴を記録してラグと変更量を特徴量にすると、時系列順の運用で予測が積み上がり依存グラフ単独を上回る"
  planted_text: "合成変更 65 件を seq 順に処理。同じ要素が 2〜7 回変更されるのでラグに値が入る。予測には seq 未満の記録だけを使う"
  control_text: "カバレッジ重なりのみ、履歴特徴を外した同じモデル（アブレーション）、ランダム選択"
  criteria:
    - {metric: prequential_auc, op: ">=", value: 0.75}
    - {metric: history_feature_gain, op: ">", value: 0.0}
    - {metric: late_auc_gt_early_auc, op: "==", value: 1}
    - {metric: recall_at_budget_30, op: ">=", value: 0.60}
    - {metric: beats_coverage_baseline, op: "==", value: 1}
  provenance: simulated
  budget_usd: 0
