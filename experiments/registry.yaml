# 実験レジストリ。docs/plan/02-experiment-catalog.md の合格基準を機械可読にしたもの。
# criteria は実装前に固定する。変更は ADR を伴う（ADR-007）。

- id: E3-1
  chapter: 3
  title: 軌跡カバレッジ依存グラフによる候補絞り込み
  script: experiments/e3_1_coverage.py
  hypothesis: "ツール変更で実際に反転したテストはすべて候補集合 T_cand(Δ) に含まれ、候補は全件より十分小さい"
  planted: {versions: [v06_toolschema_v2], change_kind: tool}
  planted_text: "v06_toolschema_v2（calendar_search の引数変更）。反転は v01 → v06 で測る"
  control: {change_kind: tool, components: [mail_send]}
  control_text: "合成変更 Change(kind=tool, components={mail_send})。mail_send を呼ばないテストは候補に入らない"
  criteria:
    - {metric: recall_of_flipped, op: ">=", value: 1.0}
    - {metric: candidate_ratio, op: "<=", value: 0.6}
    - {metric: control_false_candidates, op: "==", value: 0}
  provenance: simulated
  budget_usd: 0

- id: E3-2
  chapter: 3
  title: 意味的影響推定による選択
  script: experiments/e3_2_impact.py
  hypothesis: "プロンプト差分から列挙した影響タグで日付関連タスクが選ばれ、反転テストを高再現率で捉える"
  planted: {versions: [v02_dateformat], change_kind: prompt}
  planted_text: "v02_dateformat（日付書式の指示変更）"
  control: {versions: [v02b_tone]}
  control_text: "文体だけを変えた差分 v02b_tone（run は不要。diff だけ使う）"
  criteria:
    - {metric: recall_of_flipped, op: ">=", value: 0.8}
    - {metric: control_selected_ratio, op: "<=", value: 0.2}
    - {metric: precision_gain_vs_coverage, op: ">", value: 0.0}
  provenance: simulated
  budget_usd: 0.5

- id: E3-3
  chapter: 3
  title: 不確実性駆動のテスト選択
  script: experiments/e3_3_selector.py
  hypothesis: "予算 30% で H(p̂)/c による選択はランダムと直近失敗優先より逃走欠陥率が低く、expected_escape は実測と校正されている"
  planted: {versions: [v02_dateformat, v03_noverify, v04_loopy, v05_unsafe_delete, v06_toolschema_v2, v07_step_minimizer, v08_summarize_ctx, v09_model_swap]}
  planted_text: "v02〜v09 の各変更を leave-one-change-out で評価"
  control: {strategies: [random, recent_failures]}
  control_text: "同予算のランダム選択（1,000 回抽選の平均）と直近失敗優先"
  criteria:
    - {metric: escape_ratio_vs_random, op: "<=", value: 0.5}
    - {metric: calibration_error, op: "<=", value: 0.15}
  provenance: simulated
  budget_usd: 0

- id: E3-4
  chapter: 3
  title: テストピラミッドの段判定
  script: experiments/e3_4_pyramid.py
  hypothesis: "変更分類から決めた段は、反転が観測される最小の段以上である。LLM に見えない変更は L1 で止まる"
  planted: {versions: [v02_dateformat, v06_toolschema_v2, v09_model_swap]}
  planted_text: "v02（prompt → L2 以上）、v06（tool → L3 以上）、v09（model → L4）"
  control: {change_kind: code}
  control_text: "Change(kind=code)（ツールラッパーのリファクタ。版ハッシュ不変）"
  criteria:
    - {metric: level_ok_rate, op: "==", value: 1.0}
    - {metric: control_nonflake_flips, op: "==", value: 0}
  provenance: simulated
  budget_usd: 0

- id: E3-5
  chapter: 3
  title: 接頭辞キャッシュと分岐再実行
  script: experiments/e3_5_branch.py
  hypothesis: "分岐再実行は通常実行と結果が一致し、小さな変更では live ステップを大きく減らす。大きな変更ほど早く分岐する"
  planted: {versions: [v02_dateformat, v09_model_swap]}
  planted_text: "v02（小変更）と v09（モデル入替）を v01 の軌跡から分岐再実行"
  control: {versions: [v01_baseline]}
  control_text: "v01 → v01 の自己分岐。カセット／同一方策に当たるので分岐せず live ステップ 0"
  criteria:
    - {metric: outcome_agreement, op: ">=", value: 0.8}
    - {metric: live_step_ratio_v02, op: "<=", value: 0.6}
    - {metric: divergence_order_ok, op: "==", value: 1}
    - {metric: self_branch_live_steps, op: "==", value: 0}
  provenance: simulated
  budget_usd: 2.0

- id: E3-6
  chapter: 3
  title: SPRT による早期打切り
  script: experiments/e3_6_sprt.py
  hypothesis: "SPRT は名目 α=0.05, β=0.10 に近い誤り率で、固定 n 法より少ない試行で決着する"
  planted: {p_true_grid: [0.1, 0.3, 0.5, 0.7, 0.9], trials: 10000}
  planted_text: "p_true ∈ {0.1, 0.3, 0.5, 0.7, 0.9} の Monte Carlo（各 10,000 試行）と境界テスト 5 件"
  control: {method: fixed_n}
  control_text: "同じ検出力の固定 n 法"
  criteria:
    - {metric: empirical_alpha, op: "<=", value: 0.07}
    - {metric: empirical_beta, op: "<=", value: 0.12}
    - {metric: mean_n_ratio, op: "<=", value: 0.6}
    - {metric: boundary_mean_n, op: "<=", value: 8}
  provenance: simulated
  budget_usd: 0.2

- id: E3-7
  chapter: 3
  title: 逃走欠陥率・ε-探索・不可侵集合
  script: experiments/e3_7_kpi.py
  hypothesis: "予算 40% で逃走欠陥率 ≤ 0.1。ε=0.05 でランダムテストが毎回混ざる。不可侵集合は予算に関係なく常に選ばれる"
  planted: {budget_ratios: [0.05, 0.4, 1.0]}
  planted_text: "全変更に対するフル実行結果と選択結果の比較"
  control: {budget_ratio: 1.0}
  control_text: "予算 100% → 逃走欠陥率 0"
  criteria:
    - {metric: escape_rate, op: "<=", value: 0.1}
    - {metric: random_included, op: ">=", value: 1}
    - {metric: inviolable_rate, op: "==", value: 1.0}
    - {metric: full_budget_escape, op: "==", value: 0}
  provenance: simulated
  budget_usd: 0

- id: E4-1
  chapter: 4
  title: 軌跡メトリクスの選択的反応
  script: experiments/e4_1_metrics.py
  hypothesis: "植込み版は対応する指標だけを動かす"
  planted: {versions: [v04_loopy, v03_noverify]}
  planted_text: "v04_loopy（重複呼び出し率・後戻り↑）、v03_noverify（検証行動率↓）"
  control: {versions: [v01_baseline, v02_dateformat]}
  control_text: "v01 の反復（指標の分散が小さい）、v02（これらの指標は動かない）"
  criteria:
    - {metric: dup_ratio_v04_vs_v01, op: ">=", value: 2.0}
    - {metric: verification_ratio_v03_vs_v01, op: "<=", value: 0.5}
    - {metric: v02_change_within_flake_band, op: "==", value: 1}
  provenance: simulated
  budget_usd: 0

- id: E4-2
  chapter: 4
  title: アブレーションによる無駄呼び出し判定
  script: experiments/e4_2_ablation.py
  hypothesis: "v04 の無駄呼び出し率 U は v01 より高い。ジャッジ代理指標はアブレーションと十分一致する"
  planted: {versions: [v04_loopy], runs: 5}
  planted_text: "v04 の 5 run と v01 の 5 run（全呼び出しをアブレーション）"
  control: {pattern: "search → create"}
  control_text: "直後の行動に結果が使われる呼び出し（search → create）は「有用」と判定される"
  criteria:
    - {metric: waste_rate_diff, op: ">=", value: 0.15}
    - {metric: surrogate_precision, op: ">=", value: 0.7}
    - {metric: surrogate_recall, op: ">=", value: 0.7}
    - {metric: control_useful_rate, op: ">=", value: 0.9}
  provenance: simulated
  budget_usd: 5.0

- id: E4-3
  chapter: 4
  title: 軌跡リンターの決定的検出
  script: experiments/e4_3_linter.py
  hypothesis: "順序・禁止制約の違反を決定的に検出し、ベースラインでは誤検出しない"
  planted: {versions: [v05_unsafe_delete, v03_noverify]}
  planted_text: "v05_unsafe_delete（no_delete_without_backup）、v03_noverify（claim_done_requires_checks）"
  control: {versions: [v01_baseline]}
  control_text: "v01。手書きイベント列と hypothesis の性質テスト"
  criteria:
    - {metric: violation_detection_rate, op: ">=", value: 0.8}
    - {metric: baseline_violation_rate, op: "<=", value: 0.1}
    - {metric: operator_tests_pass, op: "==", value: 1}
  provenance: simulated
  budget_usd: 0

- id: E4-4
  chapter: 4
  title: 半順序マイルストーンの部分点
  script: experiments/e4_4_milestones.py
  hypothesis: "部分点は版の品質順序と整合し、順序の異なる正当な経路に満点を与える"
  planted: {versions: [v01_baseline, v03_noverify, v05_unsafe_delete]}
  planted_text: "v01 / v03 / v05 のコーパス、および順序違いの合成軌跡"
  control: {synthetic: out_of_order}
  control_text: "到達順序が制約に反する合成軌跡は減点される"
  criteria:
    - {metric: spearman_rho, op: ">=", value: 0.6}
    - {metric: synthetic_ok, op: "==", value: 1}
