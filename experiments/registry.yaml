- id: E4-5
  chapter: 4
  title: ステップ単位判定（ルーブリックと参照方策一致）
  script: experiments/e4_5_step_judge.py
  hypothesis: "行動を変異させたステップは、ルーブリック判定でも参照方策一致でも元より低く評価される"
  planted: {mutations: [wrong_tool, wrong_args, destructive], n_steps: 30}
  planted_text: "v01 の正常 run から 30 ステップを抽出し、誤ツール／誤引数／破壊的操作に置換"
  control: {rejudge: 2}
  control_text: "変異なしステップを 2 回判定して安定性を見る"
  criteria:
    - {metric: mutation_drop_rate_rubric, op: ">=", value: 0.8}
    - {metric: mutation_drop_rate_refpolicy, op: ">=", value: 0.8}
    - {metric: original_mean_score, op: ">=", value: 3.5}
    - {metric: rejudge_agreement, op: ">=", value: 0.8}
  provenance: simulated
  budget_usd: 8.0

- id: E4-6
  chapter: 4
  title: 計画の外在化と乖離率
  script: experiments/e4_6_plan.py
