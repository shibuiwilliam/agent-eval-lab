- id: E4-7
  chapter: 4
  title: 軌跡内 NIAH（想起率とコンテキスト戦略）
  script: experiments/e4_7_niah.py
  hypothesis: "想起率 R(n) はノイズ n とともに下がり、要約戦略（v08）は raw（v01）より AUC が高い"
