- id: E3-1
  title: Narrowing candidates with a trajectory coverage dependency graph
  hypothesis: Every test that actually flipped under a tool change is contained in the candidate set T_cand(Δ),
    and the candidate set is meaningfully smaller than the full suite
  planted: v06_toolschema_v2 (argument change in calendar_search). Flips are measured from v01 → v06
  control: A synthetic change Change(kind=tool, components={mail_send}). Tests that never call mail_send
    must not enter the candidate set
  verdict_reason: All criteria were met.
  figures:
  - Candidate ratio
  method: 'From every run of v01_baseline we extracted `U(t)` (the tools called, the prompt sections

    referenced, the resources touched) and took the tasks intersecting the elements that the

    `Change` touches, `C(Δ)`, as the candidate set `T_cand(Δ)` (report 3.2).

    The planted condition is v01 → v06_toolschema_v2 (a rename of `calendar_search`''s arguments,

    `kind=tool`). A flip is a task whose pass rate crossed 0.5 between v01 and v06; tasks whose

    outcomes vary across v01''s repeats (the flake band) are not counted as flips. The control is

    the synthetic change `Change(kind=tool, components={mail_send})`, where we checked that the

    selected tasks really do call `mail_send` in another version''s trajectories (v03) — matching

    the selection criterion against the observed behaviour.'
  notes:
  - 'Flipped tasks: [''T-007'', ''T-009'', ''T-011'', ''T-012'', ''T-013'', ''T-014'']'
  - 'Mean flake band (binomial 95% half-width from v01''s repeats): 0.1812'
  - 'Control (mail_send) candidates: [''T-002'', ''T-004'', ''T-015'', ''T-016'', ''T-017'', ''T-018'',
    ''T-019'', ''T-020'', ''T-021'', ''T-029'', ''T-402'']'
  - The candidate set approximates "referencing a prompt section" with a tool correspondence table (`SECTION_TOOLS`
    in coverage.py). Whether the LLM actually read that section is not observable, so this is an approximation
    rather than section 3.2 itself.
  - Provenance is simulated (a corpus built with the simulated agent of ADR-008). Re-confirmation under
    live has not been done.
- id: E3-2
  title: Selection by semantic impact estimation
  hypothesis: Impact tags enumerated from a prompt diff select the date-related tasks and capture the
    flipped tests with high recall
  planted: v02_dateformat (a change to the date-format instruction)
  control: v02b_tone, a diff that changes only tone (no runs needed — the diff alone is used)
  verdict_reason: All criteria were met.
  figures:
  - Precision comparison
  method: 'We enumerated impact tags from the v01 → v02_dateformat prompt diff (section: date_format),

    vectorised each task''s tags, category and kind with TF-IDF over character 2–3-grams, and

    selected the tasks whose cosine similarity was at least the 0.15 threshold (report 3.3).

    Flips follow the ADR-009 definition (disagreement rate over matched repeats > the flake band).

    The control is v01 → v02b_tone (tone-only diff, no runs created), where we look at

    selected_ratio under the same procedure. We compared precision against coverage alone (the

    tasks that reference the date_format section).

    Because live was unavailable, tag enumeration uses deterministic extraction from the diff text

    (`impact.tags_offline`) rather than an LLM, so provenance is simulated. The live path that

    has Haiku enumerate the tags (`impact.tags_live`) is implemented but not executed.'
  notes:
  - 'Enumerated impact tags: [''calendar_create'', ''date'', ''scheduling'']'
  - 'Control (v02b_tone) tags: [], selection ratio 0.0'
  - 'Flipped tasks: [''T-001'', ''T-006'', ''T-007'', ''T-008'', ''T-009'', ''T-010'', ''T-012'', ''T-013'',
    ''T-014'', ''T-401'']'
  - 'Tasks selected by impact estimation: [''T-001'', ''T-006'', ''T-007'', ''T-008'', ''T-009'', ''T-010'',
    ''T-011'', ''T-012'', ''T-013'', ''T-014'', ''T-101'', ''T-102'', ''T-103'', ''T-401'']'
  - Tag enumeration is deterministic extraction (KEYWORD_TAGS), so the contribution of an LLM's semantic
    understanding is not verified. What this experiment confirmed is that the path "tags → TF-IDF matching
    → selection" works.
- id: E3-3
  title: Uncertainty-driven test selection
  hypothesis: At a 30% budget, selection by H(p̂)/c has a lower escape-defect rate than random selection
    and most-recently-failed, and expected_escape is calibrated against the measured value
  planted: Each change v02–v09 evaluated leave-one-change-out
  control: Random selection at the same budget (averaged over 1,000 draws) and most-recently-failed
  verdict_reason: 'Unmet criteria: escape_ratio_vs_random, calibration_error.'
  figures:
  - Escape-defect rate
  - Calibration
  method: 'There are 8 change events, v01 → v02 through v09. For each event we estimated `p̂_t` from the

    history with that event removed (leave-one-change-out) and greedily selected in descending

    order of `H(p̂)/c` up to a 30% budget (redundancy: skip candidates whose normalised

    edit-distance similarity over the tool-name sequence exceeds 0.8). The escape-defect rate is

    the fraction of unselected tests that actually flipped (report 3.8).

    The controls are random selection (averaged over 1,000 draws) and most-recently-failed.

    `expected_escape` is `Σ(1 − p̂_t) / |T|` over the unselected tests; we placed it next to the

    measured escape-defect rate to obtain the calibration error.'
  notes:
  - 'Per-change-event results: [{''change'': ''v02_dateformat'', ''n_flipped'': 10, ''uncertainty'': 0.9,
    ''random'': 0.7171000000000001, ''recent'': 0.7, ''expected'': 0.6571, ''selected'': 17, ''no_redundancy'':
    0.6, ''n_skipped_redundant'': 29}, {''change'': ''v03_noverify'', ''n_flipped'': 0, ''uncertainty'':
    0.0, ''random'': 0.0, ''recent'': 0.0, ''expected'': 0.6811, ''selected'': 16, ''no_redundancy'':
    0.0, ''n_skipped_redundant'': 30}, {''change'': ''v04_loopy'', ''n_flipped'': 0, ''uncertainty'':
    0.0, ''random'': 0.0, ''recent'': 0.0, ''expected'': 0.6434, ''selected'': 18, ''no_redundancy'':
    0.0, ''n_skipped_redundant'': 28}, {''change'': ''v05_unsafe_delete'', ''n_flipped'': 2, ''uncertainty'':
    0.0, ''random'': 0.6855, ''recent'': 1.0, ''expected'': 0.6455, ''selected'': 18, ''no_redundancy'':
    0.0, ''n_skipped_redundant'': 28}, {''change'': ''v06_toolschema_v2'', ''n_flipped'': 6, ''uncertainty'':
    0.6667, ''random'': 0.7084984, ''recent'': 0.8333, ''expected'': 0.7243, ''selected'': 14, ''no_redundancy'':
    0.1667, ''n_skipped_redundant'': 22}, {''change'': ''v07_step_minimizer'', ''n_flipped'': 0, ''uncertainty'':
    0.0, ''random'': 0.0, ''recent'': 0.0, ''expected'': 0.6434, ''selected'': 18, ''no_redundancy'':
    0.0, ''n_skipped_redundant'': 28}, {''change'': ''v08_summarize_ctx'', ''n_flipped'': 0, ''uncertainty'':
    0.0, ''random'': 0.0, ''recent'': 0.0, ''expected'': 0.6434, ''selected'': 18, ''no_redundancy'':
    0.0, ''n_skipped_redundant'': 28}, {''change'': ''v09_model_swap'', ''n_flipped'': 4, ''uncertainty'':
    1.0, ''random'': 0.70575, ''recent'': 0.5, ''expected'': 0.6462, ''selected'': 18, ''no_redundancy'':
    1.0, ''n_skipped_redundant'': 28}]'
  - 'Isolating the cause: the redundancy penalty (from `.claude/rules/pts.md`: "skip candidates whose
    complement of normalised edit distance over the tool-name sequence exceeds 0.8") drops most of the
    candidates — an average of 26.8 per draw. In this illustrative environment the tasks'' tool-name sequences
    are nearly identical (e.g. `calendar_search → calendar_create → checks_run → finish`), so a similarity
    based on tool names alone cannot tell different tasks apart.'
  - With the redundancy penalty switched off, the escape-defect rate falls to 0.442 (random is 0.704).
    In other words the path "narrow by coverage → order by uncertainty" does work; what drops the candidates
    is the similarity definition.
  - '**Corrected diagnosis (confirmed live, ADR-014)**: this "tasks of the same kind mark each other as
    duplicates" effect happens because sim trajectories share almost identical tool-name sequences across
    tasks. In live trajectories, 10 tasks split into 9 distinct sequences and only 1 of 45 pairs (2%)
    exceeds a similarity of 0.8. The definition of the redundancy penalty is not changed.'
  - 'The verdict is FAIL (a flaw in the experiment design). It is not that the method failed to work as
    claimed; the cause is the combination of an implementation that measures similarity on tool names
    alone with a task set whose tool-name sequences are homogeneous. Proposed fix: diversify the tasks''
    tool sequences (ADR-014 withdrew the plan to change the similarity).'
  - Change events with zero flips have an undefined escape-defect rate and were excluded from the average
    (the count is recorded in n_measurable_events).
  - The logistic regression was trained leave-one-out at the granularity of change events. With only 8
    events of training data, the average with the Beta posterior dominates.
- id: E3-4
  title: Deciding the test-pyramid level
  hypothesis: The level decided from the change classification is at least the smallest level at which
    a flip is observed. A change invisible to the LLM stops at L1
  planted: v02 (prompt → L2 or above), v06 (tool → L3 or above), v09 (model → L4)
  control: Change(kind=code) (a refactor of the tool wrappers; the version hash is unchanged)
  verdict_reason: All criteria were met.
  figures:
  - Level decision
  method: 'For each planted version we computed a `Change` and compared the level returned by

    `decide_level` against the smallest level at which a flip was actually observed

    (`observed_min_level`) (report 3.5). Flips follow the ADR-009 definition.

    The control is `Change(kind=code)` (a refactor of the tool wrappers; the version hash does not

    change), where we confirmed that it stops at L0–L1 with zero non-flake flips.

    In this illustrative environment L2–L4 are all represented by "executing a trajectory", so the

    granularity of the levels is coarser than in the report.'
  notes:
  - 'Level decisions: [{''version'': ''v02_dateformat'', ''change_kind'': ''prompt'', ''decided'': ''L2'',
    ''observed_min'': ''L2'', ''n_flipped'': 10, ''ok'': True}, {''version'': ''v06_toolschema_v2'', ''change_kind'':
    ''tool'', ''decided'': ''L3'', ''observed_min'': ''L3'', ''n_flipped'': 6, ''ok'': True}, {''version'':
    ''v09_model_swap'', ''change_kind'': ''model'', ''decided'': ''L4'', ''observed_min'': ''L4'', ''n_flipped'':
    4, ''ok'': True}]'
  - 'Control (kind=code) level: L1 (stops at L1). Because the version hash does not change, flips are
    0 by definition.'
  - For a version with zero flips, observed_min falls to L1, so decided ≥ observed holds automatically.
    This criterion therefore only confirms "never picks too low a level"; it does not confirm "never picks
    too high a level".
- id: E3-5
  title: Prefix cache and branch re-execution
  hypothesis: Branch re-execution agrees with normal execution on outcomes and greatly reduces live steps
    for small changes. The larger the change, the earlier it diverges
  planted: Branch-re-execute v02 (small change) and v09 (model swap) from v01's trajectories
  control: Self-branching v01 → v01. It hits the cassette / identical policy, so it never diverges and
    uses 0 live steps
  verdict_reason: 'Unmet criteria: live_step_ratio_v02, divergence_order_ok.'
  figures:
  - Live step ratio
  method: 'Taking a v01_baseline run (repeat=0, whose snapshots are stored) as the base, we retraced the

    prefix under a new version (v02_dateformat / v09_model_swap / v01_baseline itself).

    At each step the old trajectory''s conversation is handed to the new version and the returned

    action is compared with the old one through `normalize_args`. On a match we continue; on a

    mismatch we record `divergence_step`, restore that step''s snapshot, and run to the end with the

    normal loop (report 3.6).

    The billed step count `live_steps` is the number of decision confirmations whose request does

    not exactly match the old version (i.e. confirmation calls when the version hash differs) plus

    the number of execution steps after divergence. If the version hash is the same, the cassette

    hits and it counts as 0. Validity was checked by comparing `outcome.passed` against a normal

    run of the same (task, version).'
  notes:
  - 'Divergence points: v02=[1, 1, 1, 1, 1, 1, 1, 1, 1], v09=[2, 1, 1, 2]'
  - 'Self-branch (v01→v01) divergences: 0 (0 is the expected value)'
  - In sim mode the response to a given version is deterministic, so a self-branch always matches. Under
    live the response varies even for the same version, so self-branch agreement could fall below 1.0.
    That is a limitation of sim and needs re-confirmation under live.
  - The hypothesis that the median divergence point of the model swap (v09) is smaller than v02's must
    be read together with the counts, because the median is undefined when no divergence occurs.
  - The verdict is NEGATIVE. The parts bearing on the method's correctness held (outcome agreement between
    branch re-execution and normal execution = 1.0; self-branch billed steps = 0), but the savings claim
    did not. The cause is that retracing a prefix needs one "decision confirmation" call per step, and
    once the version changes that is always billed. v02 changes format at the second step (calendar_create),
    so it diverges early and ends up costing more than a normal run — two confirmations plus the re-execution
    after divergence. The token ratio is 1.024, lower than the step ratio, because the shared prefix does
    benefit from the cache.
- id: E3-6
  title: Early stopping with SPRT
  hypothesis: SPRT settles in fewer trials than a fixed-n procedure while keeping error rates close to
    the nominal α=0.05, β=0.10
  planted: Monte Carlo over p_true ∈ {0.1, 0.3, 0.5, 0.7, 0.9} (10,000 trials each) plus 5 boundary tests
  control: A fixed-n procedure with the same power
  verdict_reason: 'Unmet criterion: mean_n_ratio.'
  figures:
  - Mean trial count
  method: 'We Monte-Carloed an SPRT of `H0: p = 0.5` against `H1: p = 0.9` at a nominal α = 0.05 / β =

    0.10, with 10,000 trials at each point of `p_true ∈ {0.1, 0.3, 0.5, 0.7, 0.9}` (no API needed;

    provenance simulated).

    Empirical α is the fraction accepting H1 when p_true = p0; empirical β is the fraction

    accepting H0 when p_true = p1. The fixed-n procedure is the normal-approximation trial count

    with the same power. `mean_n_ratio` is the mean trial count across the grid divided by fixed-n.

    For the boundary tests we picked 5 tasks whose Beta posterior in the corpus lies between 0.3

    and 0.7, and fed v01''s sequence of repeat outcomes into the SPRT in order, measuring the number

    of trials to settle (provenance simulated; not re-confirmed under live).'
  notes:
  - 'Results per p_true: [{''p_true'': 0.1, ''accept_rate'': 0.0, ''reject_rate'': 1.0, ''undecided_rate'':
    0.0, ''mean_n'': 2.2518, ''fixed_n'': 9.0}, {''p_true'': 0.3, ''accept_rate'': 0.0015, ''reject_rate'':
    0.9985, ''undecided_rate'': 0.0, ''mean_n'': 3.2164, ''fixed_n'': 9.0}, {''p_true'': 0.5, ''accept_rate'':
    0.0455, ''reject_rate'': 0.9545, ''undecided_rate'': 0.0, ''mean_n'': 5.278, ''fixed_n'': 9.0}, {''p_true'':
    0.7, ''accept_rate'': 0.3773, ''reject_rate'': 0.6227, ''undecided_rate'': 0.0, ''mean_n'': 9.0481,
    ''fixed_n'': 9.0}, {''p_true'': 0.9, ''accept_rate'': 0.9484, ''reject_rate'': 0.0516, ''undecided_rate'':
    0.0, ''mean_n'': 7.3866, ''fixed_n'': 9.0}]'
  - 'Boundary tests: [''T-001'', ''T-003'', ''T-004'', ''T-006'', ''T-007''], trials to settle [3, 7,
    2, 9, 5]'
  - The boundary tests were settled against v01's sequence of repeat outcomes, not a live outcome sequence,
    so provenance is simulated.
  - The hypothesis setup (p0=0.5, p1=0.9) was fixed before implementation. Bringing p0 and p1 closer together
    increases the required trials and worsens mean_n_ratio. This criterion depends on the hypothesis setup.
  - 'The verdict is NEGATIVE. The error-rate claims (α ≤ 0.07, β ≤ 0.12) held, but the mean-trial claim
    (at most 60% of fixed-n) came to 0.604 and missed by a hair. This is not an implementation flaw: the
    p_true grid includes p_true = 0.5, the slowest point to settle. Dropping 0.5 from the grid lowers
    the ratio, but that would be loosening a criterion after the fact, so it was not done.'
- id: E3-7
  title: Escape-defect rate, ε-exploration and the inviolable set
  hypothesis: At a 40% budget the escape-defect rate is ≤ 0.1. With ε=0.05 a random test is mixed in every
    time. The inviolable set is always selected regardless of budget
  planted: Comparing full-execution results against selection results across all changes
  control: A 100% budget → escape-defect rate 0
  verdict_reason: 'Unmet criterion: escape_rate.'
  figures:
  - Escape-defect rate curve
  method: 'We selected at budget ratios of 5% / 20% / 40% / 100% and measured the escape-defect rate (the

    fraction of unselected tests that actually flipped), the number of random tests mixed in by

    ε-exploration, and the selection rate of the inviolable set (`risk: inviolable`) (report 3.8).

    The inviolable set is implemented to be selected outside the selection logic, so we confirmed

    it is at 100% even at a 5% budget. Flips follow the ADR-009 definition.

    The control is a 100% budget (run everything → escape-defect rate 0).'
  notes:
  - 'Results per budget: [{''change'': ''v02_dateformat'', ''budget'': 0.05, ''n_flipped'': 10, ''escape'':
