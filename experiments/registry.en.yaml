  - '**A single ordering did not settle it.** The first implementation tried only one ordering of the
    changes, and on that ordering the calibration gain read +0.006. With five orderings and a **paired**
    comparison (the same ordering for ε=0 and ε=0.05) the gain becomes -0.0023 (paired SD 0.0088): **the
    effect disappeared**. The single-ordering result was picking up ordering-to-ordering variance.'
  - '**Power**: detecting an effect of this size at 80% power would need 113 orderings (407 for the escape-defect
    rate). Five is nowhere near enough. So this experiment did not show that exploration fails to improve
    calibration — it showed that **any such effect is smaller than five orderings can resolve**. The result
    is inconclusive in both directions.'
  - '**The cost of exploring stayed within the criterion.** The recall given up in the current round averages
    0.0487 (criterion 0.10), while the rounds where exploration won gained 0.0576. **On balance exploration
    is slightly ahead.** At minimum, the worry that "exploration sacrifices a lot of current-round performance"
    is refuted.'
  - 'Full observation (complete information) has a late-round Brier of 0.088, **worse** than partial observation
    at ε=0 (0.068). More data does not always calibrate better: full observation feeds in a large number
    of easy negatives, which in this low-positive setting shrinks the predicted probabilities. The control
    intended as a ceiling did not act as one.'
  - 'The verdict is NEGATIVE. The hypothesis (exploration keeps the selector calibrated) could be **neither
    confirmed nor refuted**. This is not an implementation flaw: at this scale (37 changes, 108 positives)
    the effect size is buried in ordering variance. The criterion `calibration_gain > 0` implicitly assumes
    the effect is larger than the measurement error, and that assumption did not hold. The next step would
    be 100 orderings, or several hundred synthetic changes.'
