  - '**Learning does work.** ROC AUC under family-level leave-one-group-out is 0.826 (criterion 0.75),
    and under the realistic single-change hold-out it is 0.842, above coverage alone at 0.793. The change-blind
    control (historical failure rate only) sits at 0.553, near chance, confirming that **the change information
    is what makes prediction possible**.'
  - '**What did not hold is selection recall.** At a 30% budget, recall of regressions is 0.535 for the
    learned model, 0.781 for coverage alone, 0.463 for random, against an in-budget ceiling of 0.944.
    The family breakdown explains it: **the learned model matches or beats coverage on every family except
    `fault`, where it loses badly**. Under family-level hold-out the model has never seen a tool-fault
    change, so it learns how much to trust coverage from kinds of change where coverage is weak. Ten of
    the 18 evaluable changes are faults, so the average follows them.'
  - '**Checking whether the criteria were attainable (the same audit as B5 in the previous review)**:
    `recall_ratio_vs_random >= 2.0` demands an absolute recall of 0.926 while the in-budget ceiling is
    only 0.944. That criterion therefore asks for near-oracle performance. The criteria were fixed before
    implementation so they are not changed, but **the criterion design was too demanding** and that is
    recorded here. Random already catches 46% of regressions at a 30% budget because that budget buys
    19 of 46 tasks.'
  - '**Diagnostic (outside the criteria, added after seeing the family breakdown)**: fusing the learned
    score and the coverage score by their within-change percentile ranks with equal, untuned weights gives
    recall 0.739 and an escape-defect rate of 0.270 — against random''s 0.532, a ratio of 0.507, far below
    the learned model''s 0.868 on its own. The practical implication is to **keep the dependency graph
    (report 3.2) as a separate signal and fuse it, rather than dissolving it into the model**: it is the
    insurance policy for a kind of change the model has never seen. Because this policy was added after
    seeing results, it is not used for the verdict.'
  - The verdict is FAIL (a flaw in the experiment design). Prediction works (AUC 0.826) and the controls
    are sound, but the criteria were missed because (1) the recall bar sits too close to the in-budget
    ceiling, and (2) family-level hold-out is the harshest possible setting. The method is not broken;
    the conclusion is that **at this scale (37 changes, 108 positives) learning cannot beat a simple dependency-graph
    rule in a cold start**. Industrial PTS trains on hundreds of thousands of commits, and that gap is
    what shows here.
- id: E3-9
  title: Uncertainty's role is exploration (keeping the selector calibrated)
  hypothesis: H(p-hat) exists to keep the selector calibrated, not to reduce this round's escape-defect
    rate
  planted: The 37 synthetic changes processed sequentially under partial feedback; exploration ratios
    0 / 0.05 / 0.2
  control: epsilon = 0 (pure exploitation). Full observation reported as the ceiling
  verdict_reason: 'Unmet criterion: calibration_gain.'
  figures:
  - Calibration over rounds
  - Late-round comparison
  method: 'E3-3 showed that selecting by `H(p-hat)` does not reduce this round''s escape-defect rate.
    This experiment tests the *other* role report 3.8 gives ε-exploration: "keeping the selector calibrated".


    The 37 synthetic changes are processed sequentially in a family-interleaved order under **partial
    feedback**. Each round (1) trains only on the rows observed so far, (2) selects greedily by `p_fail
    / cost` up to a 30% budget, and (3) **observes only the results of the selected tests**. Exploration
    ratios ε ∈ {0.0, 0.05, 0.2}, with the exploration slot filled either by top-`H(p-hat)` or at random.


    Each round records the recall of that round''s regressions, the escape-defect rate, and the Brier
    score **over all of that round''s tests** (including unobserved ones; used for evaluation only, never
    for training). Calibration is compared on the late rounds.


    **Robustness**: to keep the conclusion from depending on a single ordering, five orderings are run
    and every metric is averaged. Because the orderings are shared across policies, the comparison is
    **paired**.'
